<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uprak DPK</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/engine.js"></script>
  </head>
  <body class="">
    <div
      id="loader"
      class="fixed w-full h-full z-9999 bg-white flex justify-center items-center transition duration-300"
    >
      <div class="loader"></div>
    </div>
    <section data-component="navbar"></section>
    <section data-component="hero-section"></section>
    <section data-component="about-us"></section>
    <section data-component="slogan"></section>
    <section data-component="products"></section>
    <section data-component="menu"></section>
    <section data-component="why-choose-us"></section>
    <section data-component="portofolio"></section>
    <section data-component="gallery"></section>
    <section data-component="contact-us"></section>
    <section data-component="blogs"></section>
    <section data-component="faqs"></section>
    <section data-component="cta"></section>
    <footer data-component="footer"></footer>
    <script src="js/script.js"></script>
    <script>
      document.addEventListener("engine:ready", async () => {
        const loader = document.getElementById("loader");
        loader.classList.add("opacity-0", "pointer-events-none");
        const el = await callTemplate("card-why-choose-us");
        const cardsContainer = document.getElementById("cards-why-choose-us");
        await buildCardsWhyChooseUs(cardsContainer, el);
        setTimeout(() => {
          loader.remove();
        }, 600);
        document.querySelectorAll(".faq-btn").forEach((btn, idx) => {
          btn.addEventListener("click", () => {
            const content = btn.nextElementSibling;
            const icon = btn.querySelector(".faq-icon");
            const faq = document.querySelectorAll(".faq")[idx];

            if (content.style.maxHeight) {
              content.style.maxHeight = null;
              icon.style.transform = "rotate(0deg)";
              faq.classList.add("bg-[#17623b]");
              faq.classList.remove("bg-[#dd5e35]");
            } else {
              content.style.maxHeight = content.scrollHeight + "px";
              icon.style.transform = "rotate(45deg)";
              faq.classList.remove("bg-[#17623b]");
              faq.classList.add("bg-[#dd5e35]");
            }
          });
        });
      });
    </script>
  </body>
</html>
