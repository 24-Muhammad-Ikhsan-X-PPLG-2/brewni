<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uprak DPK</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/engine.js"></script>
  </head>
  <body class="overflow-x-hidden overflow-y-hidden">
    <div
      id="loader"
      class="fixed w-full h-full z-9999 bg-white flex justify-center items-center transition duration-300"
    >
      <div class="loader"></div>
    </div>
    <div data-component="navbar"></div>
    <div data-component="hero-section"></div>
    <div data-component="about-us"></div>
    <div data-component="slogan"></div>
    <script>
      document.addEventListener("engine:ready", () => {
        const loader = document.getElementById("loader");
        loader.classList.add("opacity-0", "pointer-events-none");
        document.body.classList.remove("overflow-y-hidden");
        setTimeout(() => {
          loader.remove();
        }, 600);
      });
    </script>
  </body>
</html>
